[project]
name = "flow_engineering_team"
version = "0.1.0"
description = "flow_engineering_team using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[openrouter, tools]==1.14.4",
    "gradio>=5.0.0",
    "pytest>=8.3.0",
    "pytest-playwright>=0.7.0",
]

[project.scripts]
kickoff = "flow_engineering_team.main:kickoff"
run_crew = "flow_engineering_team.main:kickoff"
plot = "flow_engineering_team.main:plot"
run_with_trigger = "flow_engineering_team.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "flow"
